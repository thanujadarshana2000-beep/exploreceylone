<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Sri Lanka</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f8f8f8;
}

/* Hero Section */

.hero{

height:100vh;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),
url("sigiriya.jpeg");

background-size:cover;
background-position:center;
display:flex;
flex-direction:column;

}

/* Navbar */

nav{

display:flex;
justify-content:space-between;
align-items:center;
padding:25px 8%;
color:white;

}

.logo{

font-size:32px;
font-weight:700;
letter-spacing:1px;

}

.logo span{

color:#00d084;

}

nav ul{

display:flex;
list-style:none;
gap:35px;

}

nav ul li{

cursor:pointer;
transition:.3s;

}

nav ul li:hover{

color:#00d084;

}

.btn{

padding:10px 24px;
background:#00d084;
border:none;
border-radius:30px;
color:white;
cursor:pointer;
font-weight:600;
transition:.3s;

}

.btn:hover{

background:#00b96b;

}

/* Hero Content */

.hero-content{

flex:1;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
flex-direction:column;
color:white;
padding:20px;

}

.hero-content h1{

font-size:70px;
font-weight:700;
margin-bottom:20px;
line-height:1.2;

}

.hero-content p{

font-size:20px;
max-width:750px;
margin-bottom:40px;
opacity:.95;

}

/* Search */

.search-box{

background:white;
padding:8px;
border-radius:50px;
display:flex;
width:650px;
max-width:95%;
box-shadow:0 15px 40px rgba(0,0,0,.2);

}

.search-box input{

flex:1;
border:none;
outline:none;
padding:16px 20px;
font-size:17px;
border-radius:50px;

}

.search-box button{

border:none;
background:#00d084;
color:white;
padding:16px 30px;
border-radius:50px;
cursor:pointer;
font-size:16px;
font-weight:600;

}

.search-box button:hover{

background:#00b96b;

}

/* Explore Button */

.explore{

margin-top:35px;
padding:16px 45px;
background:white;
color:#222;
border-radius:40px;
text-decoration:none;
font-weight:600;
transition:.3s;

}

.explore:hover{

background:#00d084;
color:white;

}

/* Scroll */

.scroll{

position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
color:white;
font-size:15px;
opacity:.8;

}

/* Responsive */

@media(max-width:768px){

.hero-content h1{

font-size:42px;

}

.hero-content p{

font-size:17px;

}

nav ul{

display:none;

}

.logo{

font-size:25px;

}

}

</style>
</head>

<body>

<section class="hero">

<nav>

<div class="logo">
Explore <span>Sri Lanka</span>
</div>

<ul>

<li>Home</li>
<li>Destinations</li>
<li>Articles</li>
<li>Guides</li>
<li>Hotels</li>
<li>Contact</li>

</ul>

<button class="btn">Sign In</button>

</nav>

<div class="hero-content">

<h1>Discover the Paradise of Sri Lanka</h1>

<p>
Explore breathtaking beaches, misty mountains, wildlife safaris,
ancient kingdoms, and unforgettable adventures with local travel experts.
</p>

<div class="search-box">

<input type="text" placeholder="Search destinations, articles or hotels...">

<button>Search</button>

</div>

<a href="#" class="explore">
Explore Now →
</a>

</div>

<div class="scroll">

▼ Scroll Down

</div>

</section>

</body>
</html>
