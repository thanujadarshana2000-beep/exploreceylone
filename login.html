<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore Sri Lanka | Login</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url("https://images.unsplash.com/photo-1578662996442-48f60103fc96?auto=format&fit=crop&w=1800&q=80");

background-size:cover;
background-position:center;

}

.container{

width:900px;
height:550px;
display:flex;
overflow:hidden;
border-radius:20px;
backdrop-filter:blur(10px);
background:rgba(255,255,255,.12);
box-shadow:0 20px 40px rgba(0,0,0,.35);

}

.left{

flex:1;
padding:50px;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
background:rgba(0,0,0,.25);

}

.left h1{

font-size:42px;
margin-bottom:15px;

}

.left p{

font-size:15px;
line-height:28px;

}

.right{

width:420px;
background:white;
padding:50px;

display:flex;
flex-direction:column;
justify-content:center;

}

.logo{

font-size:28px;
font-weight:700;
color:#0b8457;
margin-bottom:8px;

}

.subtitle{

color:#666;
margin-bottom:35px;

}

.input-box{

position:relative;
margin-bottom:20px;

}

.input-box input{

width:100%;
padding:14px 45px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
outline:none;
transition:.3s;

}

.input-box input:focus{

border-color:#0b8457;

}

.input-box i{

position:absolute;
left:15px;
top:16px;
color:#777;

}

.options{

display:flex;
justify-content:space-between;
font-size:14px;
margin-bottom:25px;

}

.options a{

text-decoration:none;
color:#0b8457;

}

.login-btn{

padding:15px;
border:none;
border-radius:10px;
background:#0b8457;
color:white;
font-size:16px;
cursor:pointer;
transition:.3s;

}

.login-btn:hover{

background:#066243;

}

.or{

text-align:center;
margin:25px 0;
color:#999;

}

.social{

display:flex;
gap:15px;

}

.social button{

flex:1;
padding:12px;
border-radius:8px;
border:1px solid #ddd;
background:white;
cursor:pointer;
transition:.3s;

}

.social button:hover{

background:#f5f5f5;

}

.register{

text-align:center;
margin-top:30px;
font-size:14px;

}

.register a{

text-decoration:none;
font-weight:600;
color:#0b8457;

}

@media(max-width:900px){

.container{

width:95%;
height:auto;
flex-direction:column;

}

.left{

display:none;

}

.right{

width:100%;

}

}

</style>

</head>
<body>

<div class="container">

<div class="left">

<h1>Explore Sri Lanka</h1>

<p>

Discover breathtaking mountains, golden beaches,
wildlife safaris, waterfalls, historical places,
and unforgettable adventures across Sri Lanka.

</p>

</div>

<div class="right">

<div class="logo">
Explore Sri Lanka
</div>

<div class="subtitle">
Welcome Back 👋
</div>

<form>

<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" placeholder="Email Address" required>
</div>

<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="password" placeholder="Password" required>
</div>

<div class="options">

<label>
<input type="checkbox">
 Remember Me
</label>

<a href="#">Forgot Password?</a>

</div>

<button class="login-btn">
Login
</button>

</form>

<div class="or">
OR
</div>

<div class="social">

<button>
<i class="fab fa-google"></i>
 Google
</button>

<button>
<i class="fab fa-facebook-f"></i>
 Facebook
</button>

</div>

<div class="register">

Don't have an account?
<a href="register.html">Register Now</a>

</div>

</div>

</div>

<script>
document.querySelector("form").addEventListener("submit", function(e){

    e.preventDefault();

    let email = document.querySelector('input[type="email"]').value;
    let password = document.querySelector('input[type="password"]').value;

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let user = users.find(u => u.email === email && u.password === password);

    if(user){

        alert("Login Successful!");

        localStorage.setItem("loggedUser", user.fullName);

        window.location.href = "article.html";

    }else{

        alert("Invalid Email or Password!");

    }

});



</script>

</body>
</html>
